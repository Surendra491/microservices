server.port: 8080
spring:
  application:
    name: accounts
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  config:
    import:
      - "application_qa.yml"
      - "application_prod.yml"
  profiles:
    active:
      - "qa"


build:
  version: "3.0"

accounts:
  message: "Welcome to sj accounts related local APIs"
  contactDetails:
    name: "Sj"
    email: "sj@sj.com"
  onCallSupport:
    - (555) 555-1234
    - (555) 523-1234